
#application config
app:
  name: sward

#web config
server:
  port: 8080

jdbc:
  driverClassName: org.postgresql.Driver
  url: jdbc:postgresql://172.13.1.13:5432/tiklab_kanass?stringtype=unspecified
  username: postgres
  password: darth2020


DATA_HOME: /opt/tiklab/sward

#dfs config
dfs:
  server:
    enabled: true
    port: 4001
    datapath: ${DATA_HOME}/files
  client:
    url: 127.0.0.1:4001
    group: g1
    bucket: sward

#dcs config
dcs:
  server:
    enabled: true
    port: 5001
    datapath: ${DATA_HOME}/caches
  client:
    url: 127.0.0.1:5001
    group: g1
    database: dcs1
    expire: 7200

#dss config
dss:
  server:
    enabled: true
    port: 6001
    datapath: ${DATA_HOME}/index
  client:
    url: 127.0.0.1:6001
    group: g1
    index: index1

#soular config
auth:
  type: local
  soular:
    address: http://e.soular.tiklab.net

external:
  url: http://e.sward.tiklab.net
