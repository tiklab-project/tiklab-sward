#application config
app:
  name: sward

#web config
server:
  port: 8080

jdbc:
  driverClassName: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5010/sward?stringtype=unspecified
  username: postgres
  password: darth2020

postgresql:
  embbed:
    enable: true
  database: sward
  db:
    port: 5010
    username: postgres
    password: darth2020
    address: ${DATA_HOME}/postgresql


auth:
  type: local
  soular:
    address: http://soular-ce.demoee.tiklab.net

DATA_HOME: /opt/tiklab/sward

#dfs config
dfs:
  server:
    enabled: true
    port: 4000
    datapath: ${DATA_HOME}/files
  client:
    url: 127.0.0.1:4000
    group: g1
    bucket: sward


#dss config
dss:
  server:
    enabled: true
    port: 6000
    datapath: ${DATA_HOME}/index
  client:
    url: 127.0.0.1:6000
    group: g1
    index: index1


external:
  url: http://sward-ce.demoee.tiklab.net