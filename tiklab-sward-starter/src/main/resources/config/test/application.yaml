#application config
app:
  name: sward

#web config
server:
  port: 8080

jdbc:
  driverClassName: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5050/tiklab_sward?stringtype=unspecified
  username: postgres
  password: darth2020

#soular
auth:
  type: local
  soular:
    address: http://soular-ce.test.tiklab.net

#enable mysql
postgresql:
  embbed:
    enable: true
  database: tiklab_sward
  db:
    port: 5050
    username: postgres
    password: darth2020
    address: ${DATA_HOME}/postgresql

DATA_HOME: /opt/tiklab/tiklab-sward

#dfs config
dfs:
  server:
    enabled: true
    port: 4002
    datapath: ${DATA_HOME}/files
  client:
    url: 127.0.0.1:4002
    group: g1
    bucket: sward

#dcs config
dcs:
  server:
    enabled: true
    port: 5002
    datapath: ${DATA_HOME}/caches
  client:
    url: 127.0.0.1:5002
    group: g1
    database: dcs1
    expire: 7200

#dss config
dss:
  server:
    enabled: true
    port: 6002
    datapath: ${DATA_HOME}/index
  client:
    url: 127.0.0.1:6002
    group: g1
    index: index1

external:
  url: http://sward-ce.test.tiklab.net
